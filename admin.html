<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lakshmi Love — Панель администратора</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="images/yorkie-3d.png" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px 15px;
    background: linear-gradient(135deg, #f4eee7, #faf8f5);
    font-family: Arial, sans-serif;
    color: #3d352e;
}

.admin-card {
    width: 100%;
    max-width: 580px;
    padding: 35px 30px;
    background: #fffdfa;
    border: 1px solid #eadfd4;
    border-radius: 22px;
    box-shadow: 0 15px 50px rgba(61,53,46,.08);
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.logo {
    display: block;
    color: inherit;
    text-decoration: none;
    font-family: Georgia, serif;
    font-size: 26px;
    margin-bottom: 6px;
}

.logo span {
    color: #c58a60;
}

.subtitle {
    color: #a18e7e;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 25px;
}

.btn-logout {
    padding: 7px 14px;
    background: #f4eee7;
    border: 1px solid #eadfd4;
    border-radius: 8px;
    font-size: 12px;
    color: #705b53;
    cursor: pointer;
    transition: .2s;
}

.btn-logout:hover {
    background: #eadfd4;
    color: #3d352e;
}

h2 {
    font-family: Georgia, serif;
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 18px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
}

input, select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #e8ded4;
    border-radius: 10px;
    background: #fff;
    font-size: 14px;
    color: #3d352e;
    outline: none;
    transition: .2s;
}

input:focus, select:focus {
    border-color: #c58a60;
    box-shadow: 0 0 0 3px rgba(197,138,96,.12);
}

.btn-submit {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #b97845;
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: .3s;
}

.btn-submit:hover {
    background: #9f6438;
}

.btn-submit:disabled {
    opacity: .6;
    cursor: wait;
}

#statusBox, #loginStatus {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.4;
}

.status-success {
    display: block !important;
    background: #edf6ef;
    color: #287348;
}

.status-error {
    display: block !important;
    background: #fbeeed;
    color: #a33d35;
}

.preview {
    display: none;
    margin-top: 12px;
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid #eadfd4;
}

.divider {
    margin: 35px 0 25px;
    border: none;
    border-top: 1px solid #eadfd4;
}

/* Список собак */
.dogs-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 380px;
    overflow-y: auto;
    padding-right: 5px;
}

.dog-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: #fff;
    border: 1px solid #ede4da;
    border-radius: 12px;
}

.dog-item img {
    width: 50px;
    height: 50px;
    border-radius: 8px;
    object-fit: cover;
    border: 1px solid #eadfd4;
}

.dog-info {
    flex: 1;
    min-width: 0;
}

.dog-name {
    font-size: 14px;
    font-weight: 600;
    color: #3d352e;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.dog-sub {
    font-size: 11px;
    color: #a18e7e;
    margin-top: 3px;
}

.btn-delete {
    padding: 8px 12px;
    background: #fde8e8;
    color: #c81e1e;
    border: 1px solid #f8b4b4;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
    white-space: nowrap;
}

.btn-delete:hover {
    background: #e02424;
    color: #fff;
}

.empty-text {
    font-size: 13px;
    color: #a18e7e;
    text-align: center;
    padding: 20px 0;
}

.hidden {
    display: none !important;
}

.note {
    margin-top: 25px;
    font-size: 11px;
    color: #a18e7e;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="admin-card">

<div class="top-bar">
        <div>
            <a class="logo" href="index.html" aria-label="Lakshmi Love — на главную">Lakshmi <span>Love</span></a>
            <div class="subtitle">Панель управления питомником</div>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <a href="breeders.html" class="btn-logout" style="text-decoration: none; display: inline-flex; align-items: center;">
                ← На сайт
            </a>
            <button id="logoutBtn" class="btn-logout hidden" type="button">Выйти</button>
        </div>
    </div>
    <!-- 1. ЭКРАН ВХОДА (виден только неавторизованным) -->
    <div id="loginSection">
        <h2>Вход для администратора</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <!-- Нейтральная подсказка, реальная почта нигде не отображается -->
                <input type="email" id="loginEmail" placeholder="Введите ваш email" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Пароль</label>
                <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit" id="loginBtn" class="btn-submit">Войти</button>
            <div id="loginStatus"></div>
        </form>
    </div>

    <!-- 2. ЭКРАН АДМИНКИ (открывается только после успешного входа) -->
    <div id="adminSection" class="hidden">
        <h2>Добавить собаку</h2>

        <form id="dogForm">
            <div class="form-group">
                <label for="name">Кличка собаки</label>
                <input type="text" id="name" placeholder="Например: Split Shot" maxlength="120" required>
            </div>

            <div class="form-group">
                <label for="title">Титулы и награды</label>
                <input type="text" id="title" placeholder="Например: Чемпион России, Чемпион РКФ" maxlength="500">
            </div>

            <div class="form-group">
                <label for="category">Категория</label>
                <select id="category" required>
                    <option value="" disabled selected>Выберите категорию</option>
                    <option value="производитель">Производитель</option>
                    <option value="производительница">Производительница</option>
                </select>
            </div>

            <div class="form-group">
                <label for="photo">Фотография</label>
                <input type="file" id="photo" accept="image/*" required>
                <img id="preview" class="preview" alt="Предпросмотр фото">
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Добавить собаку</button>
            <div id="statusBox"></div>
        </form>

        <hr class="divider">

        <h2>Список собак (удаление)</h2>
        <div id="dogsList" class="dogs-list">
            <div class="empty-text">Загрузка...</div>
        </div>
    </div>

    <div class="note">
        Lakshmi Love © 2026. Доступ разрешен только администратору.
    </div>

</div>

<script>
const SUPABASE_URL = 'https://zbazddnakicxxtbhjvzz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_uAReKc7ntb_Ctbquh8tPTw_9o6v8ozF';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Единственный разрешенный администратор
const ADMIN_EMAIL = 'left4bleood@gmail.com';

const BUCKET_NAME = 'dogs-photos';
const TABLE_NAME = 'dogs';

// Элементы страницы
const loginSection = document.getElementById('loginSection');
const adminSection = document.getElementById('adminSection');
const logoutBtn = document.getElementById('logoutBtn');
const loginForm = document.getElementById('loginForm');
const loginStatus = document.getElementById('loginStatus');
const loginBtn = document.getElementById('loginBtn');

const dogForm = document.getElementById('dogForm');
const submitBtn = document.getElementById('submitBtn');
const statusBox = document.getElementById('statusBox');
const photoInput = document.getElementById('photo');
const preview = document.getElementById('preview');
const dogsList = document.getElementById('dogsList');

// ------------------------------------------
// 1. ПРОВЕРКА СЕССИИ ПРИ ЗАПУСКЕ
// ------------------------------------------
async function checkAuth() {
    const { data: { session } } = await supabaseClient.auth.getSession();

    // Проверяем: сессия активна И email строго совпадает с вашим
    if (session && session.user && session.user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        loginSection.classList.add('hidden');
        adminSection.classList.remove('hidden');
        logoutBtn.classList.remove('hidden');
        loadDogs();
    } else {
        // Если зашел чужой аккаунт — принудительно разлогиниваем
        if (session) {
            await supabaseClient.auth.signOut();
        }
        loginSection.classList.remove('hidden');
        adminSection.classList.add('hidden');
        logoutBtn.classList.add('hidden');
    }
}

// Вход в систему
loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginStatus.className = '';
    loginStatus.textContent = '';

    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    // Защита: отклоняем любую попытку входа с чужим email
    if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        loginStatus.textContent = 'Доступ запрещен: этот email не является администратором.';
        loginStatus.className = 'status-error';
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = 'Проверка...';

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    loginBtn.disabled = false;
    loginBtn.textContent = 'Войти';

    if (error) {
        loginStatus.textContent = 'Неверный пароль!';
        loginStatus.className = 'status-error';
    } else {
        checkAuth();
    }
});

// Выход
async function logout() {
    await supabaseClient.auth.signOut();
    checkAuth();
}
logoutBtn.addEventListener('click', logout);

// Предпросмотр изображения
photoInput.addEventListener('change', function() {
    const file = this.files[0];
    if (!file) {
        preview.style.display = 'none';
        return;
    }
    const reader = new FileReader();
    reader.onload = e => {
        preview.src = e.target.result;
        preview.style.display = 'block';
    };
    reader.readAsDataURL(file);
});

function showStatus(text, type) {
    statusBox.textContent = text;
    statusBox.className = type === 'success' ? 'status-success' : 'status-error';
}

// ------------------------------------------
// 2. ЗАГРУЗКА СПИСКА СОБАК (УДАЛЕНИЕ)
// ------------------------------------------
function safeUrl(value) {
    try {
        const u = new URL(String(value || ''), location.href);
        return (u.protocol === 'https:' || u.protocol === 'http:') ? u.href : '';
    } catch (e) {
        return '';
    }
}

function setListMessage(text, isError) {
    dogsList.replaceChildren();
    const msg = document.createElement('div');
    msg.className = 'empty-text';
    if (isError) msg.style.color = '#c81e1e';
    msg.textContent = text;
    dogsList.appendChild(msg);
}

async function loadDogs() {
    setListMessage('Загрузка списка...');

    const { data: dogs, error } = await supabaseClient
        .from(TABLE_NAME)
        .select('*')
        .order('id', { ascending: false });

    if (error) {
        setListMessage('Ошибка: ' + error.message, true);
        return;
    }

    if (!dogs || dogs.length === 0) {
        setListMessage('Собак в базе пока нет');
        return;
    }

    dogsList.replaceChildren();
    dogs.forEach(dog => {
        const item = document.createElement('div');
        item.className = 'dog-item';

        const img = document.createElement('img');
        const src = safeUrl(dog.image_url);
        if (src) img.src = src;
        img.alt = dog.name || '';

        const info = document.createElement('div');
        info.className = 'dog-info';

        const name = document.createElement('div');
        name.className = 'dog-name';
        name.textContent = dog.name || '';

        const sub = document.createElement('div');
        sub.className = 'dog-sub';
        sub.textContent = (dog.category || '') + ' ' + (dog.title ? '• ' + dog.title : '');

        info.append(name, sub);

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'btn-delete';
        delBtn.textContent = 'Удалить';
        delBtn.addEventListener('click', () => deleteDog(dog.id, dog.image_url));

        item.append(img, info, delBtn);
        dogsList.appendChild(item);
    });
}

// ------------------------------------------
// 3. УДАЛЕНИЕ СОБАКИ
// ------------------------------------------
async function deleteDog(dogId, imageUrl) {
    if (!confirm('Вы точно хотите удалить эту собаку?')) return;

    try {
        // Удаляем из таблицы dogs
        const { error: dbError } = await supabaseClient
            .from(TABLE_NAME)
            .delete()
            .eq('id', dogId);

        if (dbError) throw new Error(dbError.message);

        // Удаляем фото из хранилища dogs-photos
        try {
            const fileName = imageUrl ? decodeURIComponent(imageUrl.split('/').pop().split('?')[0]) : '';
            if (fileName) {
                await supabaseClient.storage.from(BUCKET_NAME).remove([fileName]);
            }
        } catch (e) {
            console.warn('Не удалось удалить файл из хранилища:', e);
        }

        showStatus('✓ Собака успешно удалена!', 'success');
        loadDogs();
    } catch (err) {
        alert('Ошибка при удалении: ' + err.message);
    }
}

// ------------------------------------------
// 4. ДОБАВЛЕНИЕ НОВОЙ СОБАКИ
// ------------------------------------------
dogForm.addEventListener('submit', async function(e) {
    e.preventDefault();
    statusBox.className = '';
    statusBox.textContent = '';

    const name = document.getElementById('name').value.trim();
    const title = document.getElementById('title').value.trim();
    const category = document.getElementById('category').value;
    const file = photoInput.files[0];

    if (!name || !category || !file) {
        showStatus('Пожалуйста, заполните все обязательные поля.', 'error');
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Загрузка фото...';

    let uploadedPath = null;

    try {
        const ext = file.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
        const fileName = `${crypto.randomUUID()}.${ext}`;

        // 1. Загрузка в бакет
        const { data: uploadData, error: uploadError } = await supabaseClient.storage
            .from(BUCKET_NAME)
            .upload(fileName, file, { cacheControl: '3600', upsert: false });

        if (uploadError) throw new Error('Ошибка загрузки фото: ' + uploadError.message);
        uploadedPath = uploadData.path;

        // 2. Получение ссылки
        const { data: publicData } = supabaseClient.storage
            .from(BUCKET_NAME)
            .getPublicUrl(uploadedPath);

        const imageUrl = publicData.publicUrl;

        // 3. Запись в базу
        submitBtn.textContent = 'Сохранение данных...';
        const { error: insertError } = await supabaseClient
            .from(TABLE_NAME)
            .insert([{ name, title, category, image_url: imageUrl }]);

        if (insertError) throw new Error('Ошибка сохранения: ' + insertError.message);

        showStatus('✓ Собака успешно добавлена!', 'success');
        dogForm.reset();
        preview.style.display = 'none';

        loadDogs();

    } catch (err) {
        showStatus('Ошибка: ' + err.message, 'error');
        if (uploadedPath) {
            await supabaseClient.storage.from(BUCKET_NAME).remove([uploadedPath]);
        }
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Добавить собаку';
    }
});

// Проверка сессии при открытии страницы
document.addEventListener('DOMContentLoaded', checkAuth);
</script>

</body>
</html>
